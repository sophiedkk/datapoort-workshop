# Publishes the demo page (handouts/out/demo.html, built locally by handouts/build.sh and
# committed) as the GitHub Pages site. Rebuild and commit demo.html to update the site.
name: Publish demo page

on:
  push:
    branches: [main]
    paths: [handouts/out/demo.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir site
          cp handouts/out/demo.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
